variables:
  DOCKER_REV: "486541129a8e7bf77c2cf7cd76ca998f690d5685"
  BINDIST_REF: "master"

.build:
  script:
    - .gitlab/ci.sh

.build-x86_64-linux-deb12:
  extends: .build
  variables:
    NO_LLVM: 1
    GHC_ARGS: -fPIC
  image: "registry.gitlab.haskell.org/ghc/ci-images/x86_64-linux-deb12:$DOCKER_REV"
  tags:
    - x86_64-linux

.build-i386-linux-deb10:
  extends: .build
  variables:
    BINDIST_JOB: "i386-linux-deb10-validate"
    NO_LLVM: 1
  image: "registry.gitlab.haskell.org/ghc/ci-images/i386-linux-deb10:$DOCKER_REV"
  tags:
    - x86_64-linux

.build-x86_64-darwin:
  extends: .build
  variables:
    NO_LLVM: 1
  tags:
    - x86_64-darwin

.build-aarch64-darwin:
  extends: .build
  variables:
    NO_LLVM: 1
  tags:
    - aarch64-darwin

.build-aarch64-linux-deb12:
  extends: .build
  variables:
    NO_LLVM: 1
  image: "registry.gitlab.haskell.org/ghc/ci-images/aarch64-linux-deb12:$DOCKER_REV"
  tags:
    - aarch64-linux
